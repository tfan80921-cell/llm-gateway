# Entorno: producción primaria (AWS)
# Misma cascada lógica; secrets vía env del task/instance (no hardcode).

model_list:
  - model_name: chat-free
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      order: 1
  - model_name: chat-free
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 2
  - model_name: chat-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      order: 3

router_settings:
  num_retries: 2
  timeout: 60

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # database_url: os.environ/DATABASE_URL   # descomentar con Postgres para spend/keys

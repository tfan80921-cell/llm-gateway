# Referencia compartida — la cascada real se define por entorno
# (local.yaml / aws.yaml / replica.yaml) para poder divergir sin romper dev.

model_list:
  # --- chat-free: cascada orientada a free / barato ---
  - model_name: chat-free
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      order: 1
  - model_name: chat-free
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
      order: 2
  - model_name: chat-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1
      order: 3

router_settings:
  num_retries: 2
  timeout: 60

litellm_settings:
  # drop params no soportados por algunos proveedores free
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
